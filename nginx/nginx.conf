# ── Rate limiting ─────────────────────────────────────────────────
# Limite les requêtes par IP pour protéger contre le brute force
limit_req_zone $binary_remote_addr zone=cesizen:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Rate limiting ────────────────────────────────────────
    limit_req zone=cesizen burst=20 nodelay;
    limit_req_status 429;

    # ── Compression gzip ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Headers de sécurité ───────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' https://kfelnflvpsymrkdredpo.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://kfelnflvpsymrkdredpo.supabase.co wss://kfelnflvpsymrkdredpo.supabase.co https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:;" always;

    # ── Cache assets statiques ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Réappliquer les headers de sécurité (location écrase le server block)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Flutter Web SPA routing ───────────────────────────────
    # Toutes les routes renvoient vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Bloquer accès fichiers sensibles ─────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|git|sh|bat)$ {
        deny all;
        return 404;
    }
}
