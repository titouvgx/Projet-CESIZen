# ── HTTP : challenge certbot + redirect HTTPS ─────────────────────
server {
    listen 80;
    server_name TON_DOMAINE.fr www.TON_DOMAINE.fr;

    # Nécessaire pour la vérification Let's Encrypt (renouvellement)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS : TLS + reverse proxy vers le conteneur cesizen ─────────
server {
    listen 443 ssl;
    server_name TON_DOMAINE.fr www.TON_DOMAINE.fr;

    ssl_certificate     /etc/letsencrypt/live/TON_DOMAINE.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TON_DOMAINE.fr/privkey.pem;

    # Compression gzip côté proxy
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Proxy vers le conteneur cesizen (qui sert les fichiers statiques)
    # Le conteneur cesizen gère lui-même try_files pour le routing SPA
    location / {
        proxy_pass         http://cesizen;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Headers de sécurité
    add_header X-Frame-Options 'SAMEORIGIN';
    add_header X-Content-Type-Options 'nosniff';
    add_header X-XSS-Protection '1; mode=block';
    add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains';
}
