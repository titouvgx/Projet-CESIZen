# ── Rate limiting ─────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=cesizen_prod:10m rate=10r/s;

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────
server {
    listen 80;
    server_name TON_DOMAINE.fr www.TON_DOMAINE.fr;

    # Challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Serveur HTTPS ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name TON_DOMAINE.fr www.TON_DOMAINE.fr;

    # ── Certificats SSL ───────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/TON_DOMAINE.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TON_DOMAINE.fr/privkey.pem;

    # ── Configuration SSL renforcée ───────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Rate limiting ─────────────────────────────────────────
    limit_req zone=cesizen_prod burst=20 nodelay;
    limit_req_status 429;

    # ── Compression gzip ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Headers de sécurité ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' https://kfelnflvpsymrkdredpo.supabase.co https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' https://kfelnflvpsymrkdredpo.supabase.co wss://kfelnflvpsymrkdredpo.supabase.co; font-src 'self' https://fonts.gstatic.com data:;" always;

    # ── Proxy vers conteneur cesizen ──────────────────────────
    location / {
        proxy_pass         http://cesizen;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Cache assets statiques ────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://cesizen;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Bloquer accès fichiers sensibles ─────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|git|sh|bat)$ {
        deny all;
        return 404;
    }
}
